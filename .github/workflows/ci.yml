name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-fresh:
    name: Committed WASM built from this core/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Vercel ships web/src/core/generated as committed. Each module (the engine, the HEIC
      # decoder) embeds a hash of the core sources it was built from (core/cmake/SourceHash.cmake),
      # which must match this tree.
      - name: Check
        run: |
          source=$(cmake -DCORE=core -P core/cmake/SourceHash.cmake)
          for module in pixie_core pixie_heif; do
            if ! grep -qaF "$source" web/src/core/generated/$module.wasm; then
              echo "::error::web/src/core/generated/$module.wasm was not built from this core/ (source hash $source). Run 'npm run build:wasm' in web/ and commit the output."
              exit 1
            fi
          done

  core:
    name: Core (native tests with ASan + UBSan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # The fetched sources and mozjpeg's archive: object files would rebuild anyway
      # (ninja rebuilds whatever its log, which isn't cached, doesn't list).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/native-asan/_deps/*-src
            build/native-asan/_deps/*-subbuild
            build/native-asan/mozjpeg_ep-prefix/src/*.tar.gz
          key: deps-native-sources-${{ hashFiles('core/cmake/Dependencies.cmake', 'core/cmake/patches/**') }}
          # Sources of an older key are reused: each download's name carries its hash and
          # its patches' (Dependencies.cmake), so only what changed is fetched again.
          restore-keys: deps-native-sources-
      - name: Configure
        run: cmake --preset native-asan
      - name: Build
        run: cmake --build --preset native-asan
      - name: Test
        run: ctest --preset native-asan

  web:
    name: Web (types, lint, unit and browser tests on the committed engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Xvfb comes with the browsers' dependencies (playwright install --with-deps).
      - name: Install software OpenGL
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check and production build (what Vercel runs)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests against the production build (Chromium, Firefox, WebKit)
        # Firefox runs headed on a virtual display: headless Firefox has no WebGL on Linux.
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          E2E_FIREFOX_HEADED: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
