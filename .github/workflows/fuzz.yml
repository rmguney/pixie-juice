name: Fuzz

# When the engine changes, apart from CI (whose job names Vercel waits on): the engine under
# libFuzzer with ASan and UBSan, from a corpus kept between runs. See core/fuzz/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to fuzz
        default: '30'

# A burst of pushes runs once: one run at a time, and only the latest waiting one starts
# after it (not cancelled midway, which would lose its corpus and findings).
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (ASan + UBSan)
    runs-on: ubuntu-24.04  # the clang packages below are this release's
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # clang with its runtimes (libFuzzer, the sanitizers) as the fuzz preset expects. Version 20:
      # with clang 18, the default here, libstdc++ doesn't offer std::expected.
      - name: Install Ninja and clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-20 libclang-rt-20-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/fuzz/_deps/*-src
            build/fuzz/_deps/*-subbuild
            build/fuzz/mozjpeg_ep-prefix/src/*.tar.gz
          key: deps-fuzz-sources-${{ hashFiles('core/cmake/Dependencies.cmake', 'core/cmake/patches/**') }}
          restore-keys: deps-fuzz-sources-
      # The corpus grows run by run: restored from the latest run, saved under this
      # one (also when a crash fails the run, so what it found isn't lost).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
      # A failed build or a crash also puts its first lines on the run page (../.github/annotate-error.sh).
      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset fuzz 2>&1 | tee ../build/fuzz-build.log || {
            awk '/FAILED:/ { on = 1 } on && !/^\[/ { print; if (++n == 40) exit }' ../build/fuzz-build.log \
              | bash ../.github/annotate-error.sh "Build failed"
            exit 1; }
      - name: Fuzz
        id: fuzz
        run: |
          set -o pipefail
          mkdir -p ../build/fuzz-corpus ../build/fuzz-crashes
          ../build/fuzz/pixie_fuzz_seeds ../build/fuzz-seeds
          seconds=$(( ${{ github.event.inputs.minutes || 30 }} * 60 ))
          cd ../build/fuzz-crashes
          ../fuzz/pixie_fuzz -fork=2 -ignore_timeouts=1 -ignore_ooms=1 -timeout=60 -rss_limit_mb=3072 \
            -max_len=262144 -max_total_time=$seconds ../fuzz-corpus ../fuzz-seeds 2>&1 | tee ../fuzz.log || {
            awk '/ERROR: |runtime error:/ { on = 1 } on { print; if (++n == 60) exit }' ../fuzz.log \
              | bash ../../.github/annotate-error.sh "Fuzzer found a crash"
            exit 1; }
      # Only inputs that add coverage are kept, so the corpus doesn't grow without end.
      - name: Minimize the corpus
        if: steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure'
        run: |
          mkdir -p ../build/fuzz-corpus-min
          ../build/fuzz/pixie_fuzz -merge=1 -timeout=60 -rss_limit_mb=3072 -max_len=262144             ../build/fuzz-corpus-min ../build/fuzz-corpus
          rm -rf ../build/fuzz-corpus
          mv ../build/fuzz-corpus-min ../build/fuzz-corpus
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure'
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz-crashes
          retention-days: 30
